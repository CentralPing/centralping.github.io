name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve source refs
        id: source_refs
        shell: bash
        env:
          CLIENT_PACKAGE: ${{ github.event.client_payload.package || '' }}
          CLIENT_VERSION: ${{ github.event.client_payload.version || 'main' }}
        run: |
          pkg="${CLIENT_PACKAGE}"
          pkg="${pkg#@centralping/}"
          ver="${CLIENT_VERSION}"
          if [[ "$ver" == "dev" ]]; then ver="main"; fi

          validate_ref() {
            local ref="$1" label="$2"
            if [[ "$ref" != "main" && ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::Invalid $label ref: $ref"
              exit 1
            fi
          }

          if [[ -z "$pkg" || "$pkg" == "ergo" ]]; then
            ergo_ref="$ver"
            router_ref="main"
          elif [[ "$pkg" == "ergo-router" ]]; then
            ergo_ref="main"
            router_ref="$ver"
          else
            echo "::error::Unsupported package: $pkg"
            exit 1
          fi

          validate_ref "$ergo_ref" "ergo"
          validate_ref "$router_ref" "ergo-router"

          echo "ergo=$ergo_ref" >> "$GITHUB_OUTPUT"
          echo "router=$router_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout ergo source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: CentralPing/ergo
          path: .ergo-source
          ref: ${{ steps.source_refs.outputs.ergo }}

      - name: Checkout ergo-router source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: CentralPing/ergo-router
          path: .ergo-router-source
          ref: ${{ steps.source_refs.outputs.router }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install ergo dependencies
        run: npm install --ignore-scripts --omit=dev
        working-directory: .ergo-source

      - name: Install ergo-router dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/.ergo-source" "$GITHUB_WORKSPACE/ergo"
          npm pkg delete scripts.prepare --prefix "$GITHUB_WORKSPACE/ergo"
          npm install --ignore-scripts --omit=dev
        working-directory: .ergo-router-source

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
