name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docs-update dispatch contract (repository_dispatch event-type: docs-update):
      # - Payload: {package, version}. package may be scoped (@centralping/…) or short.
      # - Supported packages: ergo, ergo-router, ergo-fetch, ergo-wire.
      # - version "dev" → main; otherwise main or vX.Y.Z (+optional pre-release/build).
      # - ergo / empty package: pin .ergo-source to version; ergo-router → main.
      # - ergo-router: pin .ergo-router-source to version; ergo → main.
      # - ergo-fetch / ergo-wire: rebuild site with ergo+router both at main.
      #   Payload version is validated for contract uniformity but does not yet pin a
      #   package-source checkout — add .ergo-fetch-source / .ergo-wire-source only when
      #   astro.config.mjs / content.config.ts consume them (#229).
      # - Auth: org secret WEBSITE_DISPATCH_TOKEN (selected repos: ergo, ergo-router,
      #   ergo-fetch, ergo-wire, json-api-query).
      - name: Resolve source refs
        id: source_refs
        shell: bash
        env:
          CLIENT_PACKAGE: ${{ github.event.client_payload.package || '' }}
          CLIENT_VERSION: ${{ github.event.client_payload.version || 'main' }}
        run: |
          pkg="${CLIENT_PACKAGE}"
          pkg="${pkg#@centralping/}"
          ver="${CLIENT_VERSION}"
          if [[ "$ver" == "dev" ]]; then ver="main"; fi

          validate_ref() {
            local ref="$1" label="$2"
            if [[ "$ref" != "main" && ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::Invalid $label ref: $ref"
              exit 1
            fi
          }

          if [[ -z "$pkg" || "$pkg" == "ergo" ]]; then
            ergo_ref="$ver"
            router_ref="main"
          elif [[ "$pkg" == "ergo-router" ]]; then
            ergo_ref="main"
            router_ref="$ver"
          elif [[ "$pkg" == "ergo-fetch" || "$pkg" == "ergo-wire" ]]; then
            validate_ref "$ver" "package version"
            ergo_ref="main"
            router_ref="main"
          else
            echo "::error::Unsupported package: $pkg"
            exit 1
          fi

          validate_ref "$ergo_ref" "ergo"
          validate_ref "$router_ref" "ergo-router"

          echo "ergo=$ergo_ref" >> "$GITHUB_OUTPUT"
          echo "router=$router_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout ergo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CentralPing/ergo
          path: .ergo-source
          ref: ${{ steps.source_refs.outputs.ergo }}

      - name: Checkout ergo-router source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CentralPing/ergo-router
          path: .ergo-router-source
          ref: ${{ steps.source_refs.outputs.router }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install ergo dependencies
        run: npm install --ignore-scripts --omit=dev
        working-directory: .ergo-source

      - name: Install ergo-router dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/.ergo-source" "$GITHUB_WORKSPACE/ergo"
          npm pkg delete scripts.prepare --prefix "$GITHUB_WORKSPACE/ergo"
          npm install --ignore-scripts --omit=dev
        working-directory: .ergo-router-source

      - run: npm ci

      - name: Verify TypeDoc entry points exist
        run: npm run verify:typedoc-entrypoints

      - run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
