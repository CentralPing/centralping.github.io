name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ergo source
        uses: actions/checkout@v4
        with:
          repository: CentralPing/ergo
          path: .ergo-source
          ref: ${{ github.event.client_payload.version == 'dev' && 'main' || github.event.client_payload.version || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ergo dependencies
        run: npm install --ignore-scripts --omit=dev
        working-directory: .ergo-source

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
