version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: ["JasonCust"]
    reviewers: ["JasonCust"]
    labels: ["ci"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    assignees: ["JasonCust"]
    reviewers: ["JasonCust"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
